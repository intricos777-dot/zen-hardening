# /etc/security/faillock.conf — proposed replacement
#
# Install:  sudo cp faillock.conf /etc/security/faillock.conf
#           sudo systemctl restart sddm.service
# Revert:   sudo cp faillock.conf.orig /etc/security/faillock.conf
#           sudo systemctl restart sddm.service
#
# GOAL: make it effectively impossible for the primary admin to lock
# themselves out, WITHOUT disabling brute-force protection.
#
# The approach is to lengthen unlock_time rather than exempt the account.
# pam_faillock has no "never lock this user" directive; the closest
# options (deny = 0, or removing the module) disable the protection
# entirely for every account, which is worse than the problem it solves.

# --- Tallying ---
# Failures counted per user before the account locks.
deny = 10

# --- Unlock timing ---
# How long the account stays locked after reaching the deny threshold.
# 1800s = 30 minutes: long enough that a determined attacker gains nothing
# from a single attempt, short enough that a fat-fingered admin is never
# stranded. Default is 600s (10 min).
unlock_time = 1800

# --- Even counts (root) ---
# NOT enabled. This is the setting that would exempt an account from
# locking entirely, and it is deliberately left off: it applies to root by
# default, and turning it on for a normal admin account is the mechanism
# an attacker would target.

# --- Logging ---
# audit = silent logs the user name when an unknown user attempts login.
# That is the brute-force-enumeration signal: watching for it makes a
# password-spraying attempt visible in the journal.
audit = silent
