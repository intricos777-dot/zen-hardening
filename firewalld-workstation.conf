<?xml version="1.0" encoding="utf-8"?>
<!--
  Workstation firewall - Garuda Linux / Arch

  Install:
    sudo cp firewalld-workstation.conf /etc/firewalld/zones/public.xml
    sudo firewall-cmd reload
  Revert:
    sudo rm /etc/firewalld/zones/public.xml
    sudo firewall-cmd reload

  Zone: public (Garuda's default active zone)
  Opens: NOTHING. Deny all inbound except what firewalld's built-in
  public zone needs for the link itself (DHCPv6-client, IPv6 NDP,
  PMTU/ICMP). firewalld MERGES this file over the built-in zone rather
  than replacing it, so those essentials are not lost.

  SSH was removed 2026-09-26: sshd is disabled and not listening, so the
  rule propped open a door with no service behind it. Re-add explicitly
  if you ever enable sshd:
    sudo firewall-cmd permanent zone=public add-service=ssh

  KDE Connect stays blocked here. To allow it only on a network you
  administer, use set-home-trusted-zone.sh (deferred, not applied).

  Steam needs more and is NOT configured here. Add explicitly when ready:
    sudo firewall-cmd add-port=27015-27016/udp permanent
    sudo firewall-cmd add-port=27017-27019/tcp permanent
-->
<zone>
  <short>Public</short>
  <description>Workstation profile: deny all inbound except link essentials.</description>

  <!-- No mdns or SMB chatter on untrusted networks -->
  <service name="mdns" enable="no"/>
  <service name="samba-client" enable="no"/>

  <!-- ICMP: REQUIRED. PMTU (packet-too-big) and IPv6 NDP (v6-neighbour-solicit)
       must pass or IPv6 breaks and large HTTPS downloads stall. Do not block. -->
  <protocol value="icmp"/>
  <protocol value="ipv6-icmp"/>

  <masquerade/>
</zone>
