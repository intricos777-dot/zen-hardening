<?xml version="1.0" encoding="utf-8"?>
<!--
  Workstation firewall — Garuda Linux / Arch
  Install:  sudo cp firewalld-workstation.conf /etc/firewalld/zones/public.xml
            sudo firewall-cmd --reload
  Revert:   sudo rm /etc/firewalld/zones/public.xml && sudo firewall-cmd --reload

  Zone: public (Garuda's default active zone)
  Opens: SSH only.

  Steam needs more and is NOT configured here. Add explicitly when ready:
    sudo firewall-cmd --add-port=27015-27016/udp --permanent   # matchmaking
    sudo firewall-cmd --add-port=27017-27019/tcp --permanent   # in-home streaming
-->
<zone>
  <short>Public</short>
  <description>Workstation profile: deny incoming except SSH.</description>

  <service name="ssh"/>

  <!-- No mdns or SMB chatter on untrusted networks -->
  <service name="mdns" disable="yes"/>
  <service name="samba-client" enable="no"/>

  <!-- ICMP: keep ping for diagnostics -->
  <protocol value="icmp"/>
  <protocol value="ipv6-icmp"/>

  <masquerade/>
</zone>
