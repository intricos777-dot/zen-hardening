# Watermark: Living_Sin (intricos777-dot) + AI agents (Hermes, Lia, opencode) - collaborative work
# System hardening — Garuda Linux / Arch
# Installed to /etc/sysctl.d/99-hardening.conf
# REVERT:  sudo rm /etc/sysctl.d/99-hardening.conf && sudo sysctl --system
#
# Every value below shows the current live value in a trailing comment where it differed.

# --- Kernel pointer exposure ---
# Leaks kernel addresses to unprivileged users, defeating KASLR.
# Current live value: 0  (insecure default on this machine)
kernel.kptr_restrict = 1

# Restrict dmesg to root. Already 1, stated explicitly so the file is self-documenting.
kernel.dmesg_restrict = 1

# --- BPF / eBPF ---
# Current live value: 2 (already strict, kept for documentation)
kernel.unprivileged_bpf_disabled = 2

# --- Network ---
# Don't accept ICMP redirects (used in MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Reject source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log packets that aren't from a valid source address
net.ipv4.conf.all.log_martians = 1

# --- SYN flood protection ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096

# --- Network hardening ---
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Filesystem ---
# Hardlink / symlink following only within the same filesystem
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# Restrict unprivileged users to their own device nodes (1 = safe default)
fs.protected_regular = 1
# FIFOs in world-writable dirs: only owner may read/write (2 = full)
fs.protected_fifos = 2

# --- Process / memory ---
# Randomize memory layout
kernel.randomize_va_space = 2

# Restrict perf_event_open to root (blocks side-channel leaks)
kernel.perf_event_paranoid = 3

# --- Core dumps ---
# Do not dump core dumps containing sensitive data
fs.suid_dumpable = 0
